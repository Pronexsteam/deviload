name: Release

# Pushing a tag like v2.0.0 builds the Windows installer, the portable zip and the
# update feed on GitHub's runners and publishes them as the latest release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Check that the tag matches the app version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match version $version" }
      - name: Fetch yt-dlp, FFmpeg and Deno
        run: pwsh -File scripts/fetch-tools.ps1
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build the installer, the portable zip and latest.json
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/package.ps1
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe', '.zip', '.json' } | ForEach-Object { $_.FullName }
          # Hand-written notes in .github/release-notes/<tag>.md win over generated ones.
          $notes = ".github/release-notes/${{ github.ref_name }}.md"
          $source = if (Test-Path $notes) { @('--notes-file', $notes) } else { @('--generate-notes') }
          gh release create "${{ github.ref_name }}" --latest --title "Deviload ${{ github.ref_name }}" @source @files

  # An unsigned macOS test build with yt-dlp, FFmpeg and Deno inside the app.
  macos:
    needs: windows
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm ci
      - name: Fetch yt-dlp, FFmpeg and Deno for macOS
        run: bash scripts/fetch-tools-macos.sh
      - run: npm run tauri build -- --target universal-apple-darwin --bundles app --config src-tauri/tauri.macos-bundle.conf.json
      - name: Attach the app to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          ditto -c -k --keepParent "src-tauri/target/universal-apple-darwin/release/bundle/macos/Deviload.app" "Deviload-${version}-macos-test.zip"
          gh release upload "$GITHUB_REF_NAME" "Deviload-${version}-macos-test.zip"
