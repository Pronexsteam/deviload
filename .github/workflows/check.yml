name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Parse the app script
        shell: powershell
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\YT-Downloader.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | ForEach-Object { Write-Host $_.ToString() }; exit 1 }
          "parse ok"
      - name: PSScriptAnalyzer (errors only)
        shell: powershell
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $r = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          $r | Format-Table -AutoSize | Out-String | Write-Host
          if ($r.Count) { exit 1 }
          "analyzer ok"
      - name: Build Deviload.exe (ps2exe)
        shell: powershell
        env:
          CI: "1"
        run: |
          Install-Module ps2exe -Scope CurrentUser -Force -AllowClobber
          Import-Module ps2exe
          Invoke-ps2exe -inputFile .\YT-Downloader.ps1 -outputFile .\Deviload.exe -noConsole -STA -title Deviload -iconFile .\icon.ico
          if (-not (Test-Path .\Deviload.exe)) { exit 1 }
          "exe: {0:N0} bytes" -f (Get-Item .\Deviload.exe).Length
      - uses: actions/upload-artifact@v4
        with:
          name: Deviload.exe
          path: Deviload.exe
