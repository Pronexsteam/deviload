name: CI

on:
  # main is protected by all four PR checks. Do not repeat the same matrix
  # after merging that tested tree; tag publication has its own Release job.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install the libraries Tauri builds against
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev libfuse2 gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav
      - run: npm ci
      - run: npm run check
      - run: npm test
      # The Windows build bundles the engines, so fetch them first.
      - name: Fetch yt-dlp, FFmpeg and Deno
        if: runner.os == 'Windows'
        run: pwsh -File scripts/fetch-tools.ps1
      - name: Fetch yt-dlp, FFmpeg and Deno for Linux
        if: runner.os == 'Linux'
        run: bash scripts/fetch-tools-linux.sh
      - name: Fetch yt-dlp, FFmpeg and Deno for macOS
        if: runner.os == 'macOS'
        run: bash scripts/fetch-tools-macos.sh
      # Unit tests run on the host; the build below checks the selected target. Where the engines
      # were fetched, the tests on generated media run too (recording, converter, Devil Cut, audio).
      - name: Run the Rust tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --manifest-path src-tauri/Cargo.toml --locked -- --include-ignored 2>&1 | tee cargo-test.log
      # Job logs need a GitHub sign-in; annotations do not, so a failure shows its end there.
      - name: Show the end of a failed test run
        if: failure()
        shell: bash
        run: |
          test -f cargo-test.log || exit 0
          grep -v -e 'Compiling ' -e 'Downloaded ' cargo-test.log | tail -n 60 | tr -d '\r' | sed 's/%/%25/g' | awk 'BEGIN { ORS = "%0A" } { print }' > tail.txt
          echo "::error title=cargo test (${{ matrix.os }})::$(cat tail.txt)"
      # CI builds are not release builds, so they skip the signed update files.
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npm run tauri build -- --target ${{ matrix.target }} --config src-tauri/tauri.ci.conf.json
      - name: Build macOS app
        if: runner.os == 'macOS'
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles app --config src-tauri/tauri.macos-bundle.conf.json
      - name: Verify macOS app resources
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Deviload.app"
          for tool in yt-dlp ffmpeg ffprobe deno; do
            test -x "$app/Contents/Resources/bin/$tool"
            "$app/Contents/Resources/bin/$tool" --version >/dev/null 2>&1 || "$app/Contents/Resources/bin/$tool" -version >/dev/null
          done
          test -s "$app/Contents/Resources/icon.icns"
      - name: Build the Debian package and AppImage
        if: runner.os == 'Linux'
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles deb,appimage --config src-tauri/tauri.ci.conf.json
      - name: Check AppImage startup on Debian 13 and Ubuntu 24.04
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          image=$(find src-tauri/target -name '*.AppImage' -type f | head -n 1)
          test -n "$image"
          for distro in debian:13 ubuntu:24.04; do
            docker run --rm -v "$PWD:/workspace:ro" "$distro" bash -c '
              set -euo pipefail
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3 squashfs-tools xvfb xauth xdotool dbus-x11 libwebkit2gtk-4.1-0 libayatana-appindicator3-1 libxdo3 libasound2t64 gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav
              useradd -m tester
              runuser -u tester -- bash /workspace/scripts/test-appimage.sh "/workspace/$1"
            ' _ "$image"
          done
      - name: Archive the macOS app with executable permissions
        if: runner.os == 'macOS'
        run: tar -czf Deviload-${{ matrix.target }}.tar.gz -C src-tauri/target/${{ matrix.target }}/release/bundle/macos "Deviload.app"
      - uses: actions/upload-artifact@v4
        with:
          name: Deviload-${{ matrix.target }}
          if-no-files-found: error
          path: |
            Deviload-*.tar.gz
            src-tauri/target/${{ matrix.target }}/release/deviload.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
