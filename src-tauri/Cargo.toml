[package]
name = "deviload"
version = "2.7.4"
description = "Deviload: desktop front-end for yt-dlp and FFmpeg"
authors = ["Samvel Avetisyan"]
edition = "2021"
license = "MIT"

[lib]
name = "deviload_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "image-png", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
dirs = "6"
tempfile = "3"
base64 = "0.22"
flate2 = "1"
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2"] }
minisign-verify = "0.2.5"
fs2 = "0.4"
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls-no-provider", "socks"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
trash = "5"
discord-rich-presence = "1.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging"] }
