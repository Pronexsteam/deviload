<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Devil Music</title><script src="theme-init.js"></script><link rel="stylesheet" href="music-mini.css"><link rel="stylesheet" href="player-controls.css"><script type="module" src="player-controls.js"></script><script type="module" src="ui-tooltips.js"></script><script type="module" src="music-mini.js"></script><link rel="stylesheet" href="theme-colors.css"><link rel="stylesheet" href="music-picture-disc.css"></head>
<body class="music-mini-page">
<header id="mini-drag"><strong>Devil Music</strong><button id="mini-pin" type="button">◇</button><button id="mini-show" type="button">↗</button><button id="mini-close" type="button">×</button></header>
<main><div class="mini-art"></div><div class="mini-content"><section><h1 id="mini-title"></h1><p id="mini-artist"></p></section>
<div class="mini-controls"><button id="mini-previous" type="button"></button><button id="mini-play" type="button"></button><button id="mini-next" type="button"></button><button id="mini-repeat" type="button"></button><button id="mini-shuffle" type="button"></button><button id="mini-mute" type="button"></button><input id="mini-volume" type="range" min="0" max="1" step=".01"></div></div></main>
<div class="mini-timeline"><span id="mini-position">0:00</span><input id="mini-progress" type="range" min="0" max="1" step=".001" value="0"><span id="mini-duration">0:00</span></div><p id="mini-status" role="status"></p>
</body></html>
