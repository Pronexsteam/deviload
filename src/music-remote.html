<!doctype html><html lang="en" data-theme="ambient"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Devil Music</title><link rel="stylesheet" href="themes.css"><link rel="stylesheet" href="music-remote.css"><script type="module" src="music-remote.js"></script></head>
<body class="remote-page"><main class="remote-player"><header><strong>Devil Music</strong><span id="remote-status" role="status">Connecting…</span></header><div class="remote-cover"><img id="remote-art" alt="" hidden><span id="remote-empty" aria-hidden="true">♪</span></div><h1 id="remote-title">Devil Music</h1><p id="remote-artist"></p><div class="remote-timeline"><input id="remote-seek" type="range" min="0" max="1" step=".00001" value="0"><div><span id="remote-time">0:00</span><span id="remote-duration">0:00</span></div></div><div class="remote-controls"><button id="remote-shuffle" data-action="shuffle"></button><button id="remote-previous" data-action="previous"></button><button id="remote-play" data-action="play"></button><button id="remote-next" data-action="next"></button><button id="remote-repeat" data-action="repeat"></button></div><div class="remote-volume"><button id="remote-mute" data-action="mute"></button><input id="remote-volume" type="range" min="0" max="1" step=".01" value="0"><span id="remote-volume-label">0%</span></div><p id="remote-note"></p></main></body></html>
